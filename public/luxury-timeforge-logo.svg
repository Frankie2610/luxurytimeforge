<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Luxury Timeforge</title>
  <desc id="desc">Biểu tượng vuông chữ L và T cách điệu trong khung đồng hồ sang trọng.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17110f"/>
      <stop offset="0.55" stop-color="#251712"/>
      <stop offset="1" stop-color="#090807"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e1a8"/>
      <stop offset="0.35" stop-color="#d5a84e"/>
      <stop offset="0.7" stop-color="#fff0bd"/>
      <stop offset="1" stop-color="#a96e23"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="#d9b66a" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#gold)" stroke-width="10" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="143" fill="none" stroke="#fff2c5" stroke-opacity=".16" stroke-width="2"/>
  <path d="M171 160v191h104" fill="none" stroke="url(#gold)" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M222 160h128M286 160v191" fill="none" stroke="url(#gold)" stroke-width="28" stroke-linecap="square"/>
  <path d="M256 93v26M256 393v26M93 256h26M393 256h26" stroke="#e3c273" stroke-width="8" stroke-linecap="round" opacity=".82"/>
  <circle cx="256" cy="256" r="9" fill="#f7deb0"/>
  <path d="M256 256l67-58" stroke="#f7deb0" stroke-width="7" stroke-linecap="round"/>
  <path d="M256 256v-82" stroke="#d7a54e" stroke-width="5" stroke-linecap="round"/>
  <text x="256" y="459" text-anchor="middle" fill="#f2d99e" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" letter-spacing="6">LUXURY TIMEFORGE</text>
</svg>
